## Project-wide Gradle settings.
#
# 本文件会随仓库发布：不要写本机绝对路径、代理或 JDK 位置。
# 需要固定 JDK / 走代理时，写到用户级配置（~/.gradle/gradle.properties）：
#   org.gradle.java.home=/path/to/jdk-17
#   systemProp.http.proxyHost=127.0.0.1 等
#
# 如需调整守护进程内存：
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.daemon=true
# Windows 上并行 worker 会卡在 dex/aidl 任务，保持关闭
org.gradle.parallel=false
org.gradle.configureondemand=true
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# 不自动下载 JDK；使用 JAVA_HOME 或用户级 org.gradle.java.home
org.gradle.java.installations.auto-download=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
